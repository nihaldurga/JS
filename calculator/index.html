
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div class="calculator">
    <h2>Calculator</h2>

    <!-- Result Display -->
    <div class="display" id="display">0</div>

    <!-- Calculator Buttons -->
    <div class="buttons">
      <button class="action">C</button>
      <button class="action">Del</button>
      <button class="action">%</button>
      <button class="action">÷</button>

      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button class="action">×</button>

      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button class="action">-</button>

      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button class="action">+</button>

      <button>0</button>
      <button>.</button>
      <button class="action">Exp</button>
      <button class="equals">=</button>
    </div>
  </div>
<script src="index.js"></script>
</body>
</html>
