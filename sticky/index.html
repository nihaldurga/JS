
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sticky Notes</title>

  <link rel="stylesheet" href="index.css">

  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&display=swap"
        rel="stylesheet">
</head>
<body>

  <main class="container">

    <h1>Sticky Notes</h1>

    <div class="note-input">
      <textarea
        id="noteInput"
        placeholder="Type a new note...."
      ></textarea>

      <button id="addNoteBtn" type="button">+</button>
    </div>

    <section id="notesContainer" class="notes-container">
      <!-- Your JavaScript should append the notes here -->
    </section>

  </main>
<script src="index.js"></script>
</body>
</html>
